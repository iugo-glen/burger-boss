name: Validate and deploy Godot web game
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.4.1 and web templates
        run: bash tools/install_godot.sh
      - name: Import, test and export (fail on engine errors)
        run: bash tools/validate.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache test browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - name: Use the Ubuntu archive for browser dependencies
        # The hosted runner's Azure mirror repeatedly downloaded at ~60 KB/s.
        # Ubuntu runners also select it through an APT mirror-list file.
        # Both mirrors serve the same signed Ubuntu packages.
        run: |
          for source_file in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list /etc/apt/apt-mirrors*.txt; do
            if [ -f "$source_file" ]; then
              sudo sed -i \
                -e 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
                -e 's|https://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
                "$source_file"
            fi
          done
      - name: Install browser dependencies
        timeout-minutes: 12
        run: npx playwright install --with-deps chromium webkit
      - name: Desktop and mobile HTML5 browser smoke
        run: npm run smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: build/browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: godot-logs
          path: build/logs
      - uses: actions/upload-artifact@v4
        with:
          name: burger-boss-web
          path: public
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: public
  deploy:
    needs: validate
    # Pages is configured; publish main after validation, never pull requests.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
