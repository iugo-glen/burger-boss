name: Validate and deploy Godot web game
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.4.1 and web templates
        run: bash tools/install_godot.sh
      - name: Import, test and export (fail on engine errors)
        run: bash tools/validate.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Desktop and mobile HTML5 browser smoke
        run: npm run smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: build/browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: godot-logs
          path: build/logs
      - uses: actions/upload-artifact@v4
        with:
          name: burger-boss-web
          path: public
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: public
  deploy:
    needs: validate
    # Pages is configured; publish main after validation, never pull requests.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
