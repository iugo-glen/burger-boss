name: Validate and deploy Godot web game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.4.1 and export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.4.1-stable_linux.x86_64.zip
          chmod +x Godot_v4.4.1-stable_linux.x86_64
          mkdir -p ~/.local/share/godot/export_templates/4.4.1.stable
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          unzip -q Godot_v4.4.1-stable_export_templates.tpz
          cp templates/* ~/.local/share/godot/export_templates/4.4.1.stable/
      - name: Import and validate
        run: |
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --editor --quit
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --quit-after 5
      - name: Export
        run: |
          mkdir -p public
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --export-release Web public/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
